  .fase strong { display: block; font-size: .95rem; }

  .donut { display: flex; align-items: center; gap: 1rem; }
  .leyenda div { font-size: .85rem; margin: .25rem 0; }
  .punto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: .4rem; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--borde); vertical-align: top; }
  th { color: var(--suave); font-weight: 600; }
  .chip { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .72rem; color: #fff; white-space: nowrap; }
  .siguiente { background: #e8f1fb; border: 2px solid var(--azul); border-radius: 8px; padding: .8rem 1rem; margin-bottom: .8rem; }
  .siguiente h3 { margin: 0 0 .3rem; font-size: 1rem; color: var(--azul); }
  .alerta { border-left: 4px solid; padding: .4rem .7rem; margin: .4rem 0; background: #fafbfc; font-size: .85rem; }
  code { font-size: .8rem; background: #eef1f4; padding: 0 .25rem; border-radius: 3px; }
  footer { padding: 0 2rem 1.5rem; font-size: .75rem; color: var(--suave); }

  const sem = document.getElementById("semaforo");
  const nombreSem = { verde: "Verde", ambar: "Ámbar", rojo: "Rojo" }[d.meta.estado] || d.meta.estado;
  sem.textContent = `Estado: ${nombreSem}`;
  sem.style.background = C[d.meta.estado] || C.gris;
  sem.title = d.meta.resumen;

  // KPIs
  const fasesOk = d.fases.filter(f => f.estado === "completada").length;
  const huVal = d.historias.filter(h => h.estado === "validada").length;
  const pTotal = d.pruebas.reduce((s, p) => s + p.total, 0);
  const pOk = d.pruebas.reduce((s, p) => s + p.superadas, 0);
  const abiertos = d.issues.filter(i => i.estado === "abierto").length;
  const bugsAb = d.issues.filter(i => i.tipo === "bug" && i.estado === "abierto").length;
  const bloqueados = d.prioridades.filter(p => p.estado === "bloqueado").length;
  const kpis = [
    { etiqueta: "Avance de fases", valor: `${pct(fasesOk, d.fases.length)} %`, detalle: `${fasesOk} de ${d.fases.length} completadas`, color: pct(fasesOk, d.fases.length) === 100 ? C.verde : C.ambar },
    { etiqueta: "Requisitos implementados", valor: `${d.requisitos.implementados}/${d.requisitos.total}`, detalle: "RF-01 a RF-09", color: d.requisitos.implementados === d.requisitos.total ? C.verde : C.ambar },
    { etiqueta: "Historias validadas", valor: `${huVal}/${d.historias.length}`, detalle: "Requiere prueba manual", color: huVal === d.historias.length ? C.verde : huVal ? C.ambar : C.rojo },
    { etiqueta: "Pruebas superadas", valor: `${pct(pOk, pTotal)} %`, detalle: `${pOk} de ${pTotal} pruebas`, color: pOk === pTotal ? C.verde : C.rojo },
    { etiqueta: "Issues abiertos", valor: `${abiertos}`, detalle: `de ${d.issues.length} en total`, color: C.azul },
    { etiqueta: "Bugs abiertos", valor: `${bugsAb}`, detalle: "Etiqueta bug", color: bugsAb ? C.ambar : C.verde },
    { etiqueta: "Prioridades bloqueadas", valor: `${bloqueados}`, detalle: "Esperan una decisión", color: bloqueados ? C.rojo : C.verde },
    { etiqueta: "Pull requests", valor: `${d.pullRequests.abiertos + d.pullRequests.cerrados}`, detalle: `${d.pullRequests.abiertos} abiertos`, color: C.gris }
  ];
  const cont = document.getElementById("kpis");
  kpis.forEach(k => cont.append(el("div", { class: "kpi", style: { borderLeftColor: k.color } }, [
    el("div", { class: "valor", text: k.valor, style: { color: k.color } }),
    el("div", { class: "etiqueta", text: k.etiqueta }),
    el("div", { class: "detalle", text: k.detalle })
  ])));

  // Fases
  const fases = document.getElementById("fases");
  d.fases.forEach(f => fases.append(el("div", { class: "fase", style: { background: colorEstado[f.estado] }, title: f.estado }, [
    el("strong", { text: f.id }), document.createTextNode(f.nombre)
  ])));

  // Prioridades
  const pr = document.getElementById("prioridades");
  const sig = d.prioridades.find(p => p.estado === "listo");
  if (sig) {
    pr.append(el("div", { class: "siguiente" }, [
      el("h3", { text: `Siguiente acción: ${sig.referencia} · ${sig.titulo}` }),
      el("div", { text: sig.justificacion }),
      el("div", { text: `Responsable: ${sig.responsable}. Hecho cuando: ${sig.finalizacion}`, style: { marginTop: ".3rem", fontSize: ".85rem", color: "#616e7c" } })
    ]));
  }
  const tabla = el("table", {}, [el("thead", {}, [el("tr", {}, ["#", "Elemento", "Estado", "Justificación", "Depende de"].map(t => el("th", { text: t })))])]);
  const cuerpo = el("tbody");
  d.prioridades.forEach(p => cuerpo.append(el("tr", {}, [
    el("td", { text: String(p.posicion) }),
    el("td", {}, [el("strong", { text: p.referencia }), el("br"), document.createTextNode(p.titulo)]),
    el("td", {}, [chip(p.estado)]),
    el("td", { text: p.justificacion }),
    el("td", { text: p.dependencias })
  ])));
  tabla.append(cuerpo);
  pr.append(tabla);

  // Alertas
  const al = document.getElementById("alertas");
  d.alertas.forEach(a => al.append(el("div", { class: "alerta", style: { borderLeftColor: colorEstado[a.nivel] } }, [chip(a.nivel), document.createTextNode(" " + a.texto)])));

  // Donut de issues
  function donut(destino, partes) {
    const total = partes.reduce((s, p) => s + p.valor, 0);
    const r = 50, circ = 2 * Math.PI * r;
    const s = svg("svg", { width: 140, height: 140, viewBox: "0 0 140 140", role: "img" });
    let acum = 0;
    partes.forEach(p => {
      const largo = total ? (p.valor / total) * circ : 0;
      s.append(svg("circle", { cx: 70, cy: 70, r, fill: "none", stroke: p.color, "stroke-width": 22,
        "stroke-dasharray": `${largo} ${circ - largo}`, "stroke-dashoffset": -acum, transform: "rotate(-90 70 70)" }));
      acum += largo;
    });
    const t = svg("text", { x: 70, y: 76, "text-anchor": "middle", "font-size": 22, "font-weight": 700 });
    t.textContent = String(total);
    s.append(t);
    const ley = el("div", { class: "leyenda" }, partes.map(p => el("div", {}, [el("span", { class: "punto", style: { background: p.color } }), document.createTextNode(`${p.nombre}: ${p.valor} (${pct(p.valor, total)} %)`)])));
    document.getElementById(destino).append(el("div", { class: "donut" }, [s, ley]));
  }
  donut("donut-issues", [
    { nombre: "Abiertos", valor: abiertos, color: C.ambar },
    { nombre: "Cerrados", valor: d.issues.length - abiertos, color: C.verde }
  ]);

  // Barras apiladas
  function barras(destino, filas) {
    const c = document.getElementById(destino);
    filas.forEach(f => {
      const total = f.partes.reduce((s, p) => s + p.valor, 0);
      c.append(el("div", { class: "barra" }, [
        el("span", { class: "nombre", text: f.nombre }),
        el("span", { class: "pista" }, f.partes.map(p => el("span", { title: `${p.nombre}: ${p.valor}`, style: { width: `${pct(p.valor, total)}%`, background: p.color } }))),
        el("span", { class: "cifra", text: f.cifra })
      ]));
    });
  }
  const tipos = [["historia", "Historias"], ["fase-6", "Tareas F6"], ["bug", "Bugs"]];
  barras("barras-tipos", tipos.map(([t, n]) => {
    const g = d.issues.filter(i => i.tipo === t), ab = g.filter(i => i.estado === "abierto").length;
    return { nombre: n, cifra: `${ab}/${g.length} abiertos`, partes: [{ nombre: "Cerrados", valor: g.length - ab, color: C.verde }, { nombre: "Abiertos", valor: ab, color: C.ambar }] };
  }));
  barras("barras-pruebas", d.pruebas.map(p => ({
    nombre: p.suite, cifra: `${p.superadas}/${p.total}`,
    partes: [{ nombre: "Superadas", valor: p.superadas, color: C.verde }, { nombre: "Fallidas", valor: p.fallidas, color: C.rojo }, { nombre: "Sin resultado", valor: p.total - p.superadas - p.fallidas, color: C.gris }]
  })));
  document.getElementById("barras-pruebas").append(el("div", { style: { fontSize: ".75rem", color: "#616e7c", marginTop: ".5rem" } },
    d.pruebas.map(p => el("div", {}, [el("code", { text: p.comando })]))));

  // Tablas simples
  function tablaSimple(destino, cab, filas) {
    const t = el("table", {}, [el("thead", {}, [el("tr", {}, cab.map(c => el("th", { text: c })))])]);
    const b = el("tbody");
    filas.forEach(f => b.append(el("tr", {}, f.map(v => el("td", {}, [typeof v === "string" ? document.createTextNode(v) : v])))));
    t.append(b);
    document.getElementById(destino).append(t);
  }
  tablaSimple("historias", ["HU", "Título", "Issue", "Estado"], d.historias.map(h => [h.id, h.titulo, `#${h.issue}`, chip(h.estado)]));
  tablaSimple("actividad", ["Commit", "Mensaje"], d.actividad.map(a => [el("code", { text: a.commit }), a.mensaje]));
  tablaSimple("calidad", ["Elemento", "Estado", "Detalle"], d.calidad.map(q => [q.elemento, chip(q.estado), q.detalle]));
  tablaSimple("agentes", ["Agente", "Estado"], d.agentes.map(a => [a.nombre, chip(a.estado)]));

  document.getElementById("fuentes").textContent = "Fuentes: " + d.meta.fuentes.join(" · ") + ". " + d.meta.resumen;
})();
</script>
</body>
</html>
