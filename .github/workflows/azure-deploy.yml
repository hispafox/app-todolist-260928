name: Azure deployment

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Resource Group de Azure donde se desplegará la aplicación.
        required: true
        default: rg-app-todolist
      web_app_name:
        description: Nombre del Azure Web App que recibirá la publicación.
        required: true
        default: app-todolist-demo
      simulate_only:
        description: Ejecuta una simulación sin publicar en Azure.
        required: false
        default: true
        type: boolean

jobs:
  validate:
    name: Validar compilación antes del despliegue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar solución .NET
        run: dotnet restore AppTodoList.sln

      - name: Ejecutar pruebas y compilación
        run: |
          dotnet test AppTodoList.sln --configuration Release --no-restore --nologo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm --prefix frontend ci

      - name: Compilar frontend
        run: npm --prefix frontend run build

      - name: Publicar API
        run: dotnet publish src/AppTodoList.Api/AppTodoList.Api.csproj -c Release -o ./publish/api --no-restore

      - name: Preparar artefacto ZIP para despliegue
        run: |
          cd ./publish
          zip -r api.zip api

      - name: Subir artefacto preparado
        uses: actions/upload-artifact@v4
        with:
          name: app-todolist-api
          path: ./publish/api.zip

  deploy:
    name: Despliegue Azure
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ !inputs.simulate_only }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Descarga del artefacto publicado
        uses: actions/download-artifact@v4
        with:
          name: app-todolist-api
          path: ./publish

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Crear o actualizar infraestructura con Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create --name "${{ inputs.resource_group }}" --location westeurope
            az deployment group create \
              --resource-group "${{ inputs.resource_group }}" \
              --template-file infra/main.bicep \
              --parameters appName="${{ inputs.web_app_name }}" location="westeurope" skuName="B1"

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.web_app_name }}
          package: ./publish/api.zip

  simulate:
    name: Simulación de despliegue
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ inputs.simulate_only }}

    steps:
      - name: Mostrar plan de despliegue simulado
        run: |
          echo "Despliegue simulado activado."
          echo "Resource Group: ${{ inputs.resource_group }}"
          echo "Azure Web App: ${{ inputs.web_app_name }}"
          echo "Se omite el despliegue real porque simulate_only=true."
          echo "Para activar el despliegue real, configura el secreto AZURE_CREDENTIALS y desactiva la simulación."
