name: Build and validate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compilar y validar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar solución .NET
        run: dotnet restore AppTodoList.sln

      - name: Ejecutar pruebas de backend
        run: dotnet test AppTodoList.sln --configuration Release --no-restore --nologo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm --prefix frontend ci

      - name: Ejecutar pruebas del frontend
        run: npm --prefix frontend test -- --run

      - name: Compilar frontend para producción
        run: npm --prefix frontend run build

      - name: Publicar API para despliegue
        run: dotnet publish src/AppTodoList.Api/AppTodoList.Api.csproj -c Release -o ./publish/api --no-restore

      - name: Subir artefacto del backend
        uses: actions/upload-artifact@v4
        with:
          name: app-todolist-api
          path: ./publish/api
